<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to the Waitlist!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2f3640;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
      color: #636e72;
      line-height: 1.5;
    }
    .logo {
      width: 100px;
      margin-bottom: 20px;
    }
    .footer {
      font-size: 12px;
      color: #b2bec3;
      margin-top: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="cid:rea-logo" alt="Logo" class="logo">
    <h1>Welcome, {{name}}!</h1>
    <p>Thank you for joining our waitlist. We’re thrilled to have you onboard and can’t wait to share updates with you!</p>
    <p>Stay tuned for exciting news and early access.</p>

    <div style="margin-top: 20px;">
      <img src="cid:ellipse-32" alt="" style="height: 20px; margin-right: 5px;">
      <img src="cid:ellipse-33" alt="" style="height: 20px;">
    </div>

    <div class="footer">
      &copy; 2025 Rea Interactive. All rights reserved.
    </div>
  </div>
</body>
</html>
