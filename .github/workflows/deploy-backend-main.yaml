name: Deploy Backend to Staging and Prod Evironment

on:
  push:
    branches:
    - staging
    - prod

jobs:
  deploy:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        trivy-config: trivy.yaml
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

    - name: Build NestJS app
      run: npm run build

    - name: Determine Environment
      id: envselect
      run: |
        echo "Branch: ${{ github.ref_name }}"
        if [ "${{ github.ref_name }}" == "staging" ]; then
          echo "SERVER_HOST=${{ secrets.STAGING_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.STAGING_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=${{ secrets.STAGING_SERVER_APP_DIR }}" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=seisho-backend-staging" >> $GITHUB_OUTPUT
          echo "HEALTH_CHECK_URL={{ secrets.STAGING_HEALTH_CHECK_URL }}" >> $GITHUB_OUTPUT
          echo "ENV_NAME=Staging" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "prod" || "${{ github.ref_name }}" == "main" ]]; then
          echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=${{ secrets.PROD_SERVER_APP_DIR }}" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=seisho-backend-prod" >> $GITHUB_OUTPUT
          echo "HEALTH_CHECK_URL={{ secrets.PROD_HEALTH_CHECK_URL }}" >> $GITHUB_OUTPUT
          echo "ENV_NAME=Production" >> $GITHUB_OUTPUT
        else
          echo "Unknown branch!"
          exit 1
        fi

    # --- Create deploy dir and change ownership ---
    - name: Prepare server directory
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          sudo mkdir -p ${{ steps.envselect.outputs.SERVER_APP_DIR }} || true
          sudo chown -R ${{ steps.envselect.outputs.SERVER_USER }}:${{ steps.envselect.outputs.SERVER_USER }} ${{ steps.envselect.outputs.SERVER_APP_DIR }} || true

    # --- Upload build to server ---
    - name: Copy files to server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: './dist,./package.json,./package-lock.json'
        target: '${{ steps.envselect.outputs.SERVER_APP_DIR }}'
        strip_components: 0

    - name: Deploy & Restart
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ${{ steps.envselect.outputs.SERVER_APP_DIR }}
          
          echo "📥 Installing production dependencies..."
          npm install --prod --legacy-peer-deps

          echo "🚀 Restarting application with PM2..."
          pm2 reload "${{ steps.envselect.outputs.PM2_APP_NAME }}" --update-env || pm2 start dist/main.js --name "${{ steps.envselect.outputs.PM2_APP_NAME }}"
          pm2 save
          pm2 list

    - name: Verify Deployment
      run: |
        echo "Waiting for app to start..."
        sleep 10
        # Simple verification via SSH check or manual confirmation for now as health check URL might be private
        echo "Deployment triggered successfully."
