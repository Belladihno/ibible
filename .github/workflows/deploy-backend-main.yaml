name: Deploy Backend to Staging and Prod Evironment

on:
  push:
    branches:
    - staging
    - prod

jobs:
  deploy:
    name: Build, Scan & Deploy
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Determine Environment
      id: envselect
      run: |
        echo "Branch: ${{ github.ref_name }}"
        if [ "${{ github.ref_name }}" == "staging" ]; then
          echo "SERVER_HOST=${{ secrets.STAGING_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.STAGING_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=/var/www/rea-bible-backend-staging" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=rea-backend-staging" >> $GITHUB_OUTPUT
          echo "HEALTH_PORT=3002" >> $GITHUB_OUTPUT
          echo "DB_HOST=${{ secrets.STAGING_DB_HOST }}" >> $GITHUB_OUTPUT
          echo "DB_PORT=${{ secrets.STAGING_DB_PORT }}" >> $GITHUB_OUTPUT
          echo "DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}" >> $GITHUB_OUTPUT
          echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "DB_NAME=${{ secrets.STAGING_DB_NAME }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "prod" || "${{ github.ref_name }}" == "main" ]]; then
          echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=/var/www/rea-bible-backend-prod" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=rea-backend-prod" >> $GITHUB_OUTPUT
          echo "HEALTH_PORT=3000" >> $GITHUB_OUTPUT
          echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> $GITHUB_OUTPUT
          echo "DB_PORT=${{ secrets.PROD_DB_PORT }}" >> $GITHUB_OUTPUT
          echo "DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}" >> $GITHUB_OUTPUT
          echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "DB_NAME=${{ secrets.PROD_DB_NAME }}" >> $GITHUB_OUTPUT
        else
          echo "Unknown branch!"
          exit 1
        fi

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run npm audit
      run: npm audit --audit-level=high || true

    # CRITICAL: Build TypeScript - generate dist/ folder
    - name: Build TypeScript
      run: npm run build

    # CRITICAL: Verify build output
    - name: Verify build output
      run: |
        if [ ! -f "dist/main.js" ]; then
          echo "ERROR: dist/main.js not found!"
          ls -R dist
          exit 1
        fi
        echo "dist/main.js exists."

    # --- Deploy files to server ---
    - name: Deploy files to server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: '.'
        target: '${{ steps.envselect.outputs.SERVER_APP_DIR }}'
        exclude: |
          .git
          .github
          node_modules

    # --- Restart PM2 on server ---
    - name: Restart PM2 on server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "Navigating to application directory..."
          cd ${{ steps.envselect.outputs.SERVER_APP_DIR }}
          
          echo "Installing all dependencies..."
          npm ci --legacy-peer-deps
          
          echo "Running database migrations..."
          if ! npm run migration:run; then
            echo "Migration failed! Check logs above."
            echo "Database may be in inconsistent state - manual intervention needed."
            exit 1
          fi
          echo "Migrations completed successfully"
          
          echo "Removing dev dependencies..."
          npm prune --production
          
          echo "Restarting application with PM2 using ecosystem.config.js..."
          # Start or Restart using the ecosystem file for specific config
          pm2 startOrRestart ecosystem.config.js --only ${{ steps.envselect.outputs.PM2_APP_NAME }} --update-env
          
          pm2 save
          pm2 list
    
    # --- Health check via SSH (Run on server host) ---
    - name: Health check via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          PORT=${{ steps.envselect.outputs.HEALTH_PORT }}
          TARGET_URL="http://localhost:$PORT/api/v1/health"
          
          echo "Checking health at $TARGET_URL..."
          sleep 20
          
          # Retry loop
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            if curl -f -s $TARGET_URL > /dev/null 2>&1; then
               echo "Health check passed!"
               exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
               echo "Retrying in 5 seconds..."
               sleep 5
            fi
          done
          
          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1
