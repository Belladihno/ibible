name: Deploy Backend to Staging and Prod Evironment

on:
  push:
    branches:
    - staging
    - prod

jobs:
  deploy:
    name: Build, Scan & Deploy
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

    - name: Build NestJS app
      run: npm run build

    - name: Determine Environment
      id: envselect
      run: |
        echo "Branch: ${{ github.ref_name }}"
        if [ "${{ github.ref_name }}" == "staging" ]; then
          echo "SERVER_HOST=${{ secrets.STAGING_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.STAGING_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=/var/www/rea-bible-backend-staging" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=rea-backend-staging" >> $GITHUB_OUTPUT
          echo "ENV_NAME=Staging" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "prod" || "${{ github.ref_name }}" == "main" ]]; then
          echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=/var/www/rea-bible-backend-prod" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=rea-backend-prod" >> $GITHUB_OUTPUT
          echo "ENV_NAME=Production" >> $GITHUB_OUTPUT
        else
          echo "Unknown branch!"
          exit 1
        fi

    - name: Deploy via SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ steps.envselect.outputs.SERVER_USER }}@${{ steps.envselect.outputs.SERVER_HOST }} << 'ENDSSH'
          set -e
          echo "📦 Navigating to application directory..."
          cd ${{ steps.envselect.outputs.SERVER_APP_DIR }}
          
          echo "📥 Installing production dependencies..."
          npm ci --omit=dev --legacy-peer-deps

          echo "🚀 Restarting application with PM2..."
          pm2 reload "${{ steps.envselect.outputs.PM2_APP_NAME }}" --update-env || pm2 restart "${{ steps.envselect.outputs.PM2_APP_NAME }}"
          pm2 save
          pm2 list
        ENDSSH
        rm -f ~/.ssh/deploy_key

    - name: Verify Deployment
      run: |
        echo "Waiting for app to start..."
        sleep 10
        echo "Deployment triggered successfully."
