name: Deploy Backend to Staging and Prod Evironment

on:
  push:
    branches:
    - staging
    - prod

jobs:
  deploy:
    name: Build, Scan & Deploy
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Determine Environment
      id: envselect
      run: |
        echo "Branch: ${{ github.ref_name }}"
        if [ "${{ github.ref_name }}" == "staging" ]; then
          echo "SERVER_HOST=${{ secrets.STAGING_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.STAGING_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=/var/www/rea-bible-backend-staging" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=rea-backend-staging" >> $GITHUB_OUTPUT
          echo "HEALTH_PORT=3002" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "prod" || "${{ github.ref_name }}" == "main" ]]; then
          echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=/var/www/rea-bible-backend-prod" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=rea-backend-prod" >> $GITHUB_OUTPUT
          echo "HEALTH_PORT=3000" >> $GITHUB_OUTPUT
        else
          echo "Unknown branch!"
          exit 1
        fi

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run npm audit
      run: npm audit --audit-level=high || true

    # CRITICAL: Build TypeScript - generate dist/ folder
    - name: Build TypeScript
      run: npm run build

    # CRITICAL: Verify build output
    - name: Verify build output
      run: |
        if [ ! -f "dist/main.js" ]; then
          echo "ERROR: dist/main.js not found!"
          ls -R dist
          exit 1
        fi
        echo "dist/main.js exists."

    # --- Deploy files to server ---
    - name: Deploy files to server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: '.'
        target: '${{ steps.envselect.outputs.SERVER_APP_DIR }}'
        exclude: |
          .git
          .github
          node_modules

    # --- Restart PM2 on server ---
    - name: Restart PM2 on server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ steps.envselect.outputs.SERVER_HOST }}
        username: ${{ steps.envselect.outputs.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "Navigating to application directory..."
          cd ${{ steps.envselect.outputs.SERVER_APP_DIR }}
          
          echo "Restarting application with PM2 using ecosystem.config.js..."
          # Start or Restart using the ecosystem file for specific config
          pm2 startOrRestart ecosystem.config.js --only ${{ steps.envselect.outputs.PM2_APP_NAME }} --update-env
          
          pm2 save
          pm2 list
    
    # --- Health check ---
    - name: Health check
      run: |
        PORT=${{ steps.envselect.outputs.HEALTH_PORT }}
        SERVER_IP=${{ steps.envselect.outputs.SERVER_HOST }}
        
        # If running on the same server (self-hosted), use localhost or private IP
        # We'll use SERVER_HOST if public, or localhost if undefined/local.
        # Since this runs on the runner, and the runner is self-hosted on the server (presumably),
        # curling localhost:$PORT is the most reliable check.
        
        TARGET_URL="http://localhost:$PORT/api/v1/health"
        
        echo "Checking health at $TARGET_URL..."
        sleep 10
        
        curl -f $TARGET_URL || {
           echo "Health check failed!"
           # Try public IP if localhost fails
           echo "Retrying with public IP..."
           curl -f "http://$SERVER_IP:$PORT/api/v1/health" || exit 1
        }
        echo "Health check passed."
