name: Deploy Backend to Staging and Prod Evironment

on:
  push:
    branches:
    - staging
    - prod

  pull_request:
    branches:
    - staging
    - prod
    types: [ opened, synchronize, reopened ]

jobs:

  pr-validation:
    name: PR Validation - Build, Lint, Test
    runs-on: [ self-hosted, linux, x64 ]
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build NestJS app
      run: npm run build

    - name: PR Validation Summary
      if: success()
      run: |
        echo "## ✅ PR Validation Passed!" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
        echo "This PR is safe to merge." >> $GITHUB_STEP_SUMMARY

    - name: PR Validation Failed
      if: failure()
      run: |
        echo "## ❌ PR Validation Failed!" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
        echo "This PR cannot be merged until all checks pass." >> $GITHUB_STEP_SUMMARY
        exit 1

  build-test:
    name: CI - Build, Lint, Test
    runs-on: [ self-hosted, linux, x64 ]
    if: github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Build NestJS app
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-dist
        path: dist/
        retention-days: 7

  deploy:
    name: CD - Deploy to server
    needs: build-test
    runs-on: [ self-hosted, linux, x64 ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-dist
        path: dist/

    - name: Determine Environment Secrets
      id: envselect
      run: |
        echo "Branch: ${{ github.ref_name }}"
        if [ "${{ github.ref_name }}" == "staging" ]; then
          echo "SERVER_HOST=${{ secrets.STAGING_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.STAGING_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_PASSWORD=${{ secrets.STAGING_SERVER_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=${{ secrets.STAGING_SERVER_APP_DIR }}" >> $GITHUB_OUTPUT
          echo "HEALTH_CHECK_URL={{ secrets.STAGING_HEALTH_CHECK_URL }}" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=seisho-backend-staging" >> $GITHUB_OUTPUT
          echo "ENV_NAME=Staging" >> $GITHUB_OUTPUT
          echo "Environment set to Staging"
        elif [[ "${{ github.ref_name }}" == "prod" || "${{ github.ref_name }}" == "main" ]]; then
          echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_PASSWORD=${{ secrets.PROD_SERVER_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=${{ secrets.PROD_SERVER_APP_DIR }}" >> $GITHUB_OUTPUT
          echo "HEALTH_CHECK_URL={{ secrets.PROD_HEALTH_CHECK_URL }}" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME=seisho-backend-prod" >> $GITHUB_OUTPUT
          echo "ENV_NAME=Production" >> $GITHUB_OUTPUT
          echo "Environment set to Production"
        else
          echo "Unknown branch!"
          exit 1
        fi

    - name: Deploy via SSH
      run: |
        sshpass -p "${{ steps.envselect.outputs.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ steps.envselect.outputs.SERVER_USER }}@${{ steps.envselect.outputs.SERVER_HOST }} << 'ENDSSH'
          set -e
          echo "📦 Navigating to application directory..."
          cd ${{ steps.envselect.outputs.SERVER_APP_DIR }}
          echo "🔄 Fetching latest code..."
          git fetch --all
          git reset --hard origin/${{ github.ref_name }}
          echo "📥 Installing dependencies..."
          npm ci --legacy-peer-deps
          echo "⚙️ creating .env file..."
          if [ "${{ github.ref_name }}" == "staging" ]; then
            cp ../.backend-staging.env .env
          else
            cp ../.backend-prod.env .env
          fi
          echo "env file created"
          echo "🔨 Building app..."
          npm run build
          echo "🛠️ Running database migrations..."
          echo "#--we should not generate migrations on staging or prod. it is gotten from the script"
          # npm run migration:run
          echo "🚀 Restarting application with PM2..."
          pm2 reload "${{ steps.envselect.outputs.PM2_APP_NAME }}" || pm2 start dist/main.js --name "${{ steps.envselect.outputs.PM2_APP_NAME }}"
          pm2 save
          pm2 list
        ENDSSH

    - name: Health Check
      env:
        SERVER_PASSWORD: ${{ steps.envselect.outputs.SERVER_PASSWORD }}
        SERVER_USER: ${{ steps.envselect.outputs.SERVER_USER }}
        SERVER_HOST: ${{ steps.envselect.outputs.SERVER_HOST }}
        SERVER_APP_DIR: ${{ steps.envselect.outputs.SERVER_APP_DIR }}
        HEALTH_CHECK_URL: "https://api.staging.seisho.emerj.net/api/v1/health"
        PM2_APP_NAME: seisho-backend-staging
        ENV_NAME: ${{ steps.envselect.outputs.ENV_NAME }}
      run: |
        sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no \
          $SERVER_USER@$SERVER_HOST << ENDSSH
          cd $SERVER_APP_DIR
          echo "🔄 Ensuring clean restart of $PM2_APP_NAME..."
          echo $HEALTH_CHECK_URL
          echo $PM2_APP_NAME

          # Stop and delete the PM2 process completely
          pm2 delete $PM2_APP_NAME || true
          
          # Wait a moment for port to be released
          sleep 5
          
          # Verify port 3600 is free
          if lsof -Pi :3600 -sTCP:LISTEN -t >/dev/null ; then
            echo "⚠️ Port 3600 still in use, forcefully killing process..."
            kill -9 $(lsof -t -i:3600) || true
            sleep 3
          fi
          
          # Start the application fresh
          pm2 start dist/main.js --name  $PM2_APP_NAME
          
          echo "Waiting for app to start..."
          sleep 40
          
          echo "🏥 Performing health check on $ENV_NAME..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_CHECK_URL || echo "000")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed with code $HTTP_STATUS"
            echo "📋 Showing logs for $PM2_APP_NAME..."
            pm2 logs $PM2_APP_NAME --lines 15 --nostream
            exit 1
          fi
        ENDSSH

    - name: Deployment Summary
      if: success()
      run: |
        echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ steps.envselect.outputs.ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

    - name: Deployment Failed
      if: failure()
      run: |
        echo "## ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ steps.envselect.outputs.ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
