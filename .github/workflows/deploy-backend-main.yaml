name: Deploy Backend to Staging and Prod Evironment

on:
  push:
    branches:
    - staging
    - prod

  pull_request:
    branches:
    - staging
    - prod
    types: [ opened, synchronize, reopened ]

jobs:

  pr-validation:
    name: PR Validation - Build, Lint, Test
    runs-on: [ self-hosted, linux, x64 ]
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # - name: Secret Scanning with Gitleaks
    #   uses: gitleaks/gitleaks-action@v2
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #     GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Only needed for commercial use

    # - name: TruffleHog Secret Scan
    #   uses: trufflesecurity/trufflehog@main
    #   with:
    #     path: ./
    #     base: ${{ github.event.repository.default_branch }}
    #     head: HEAD
    #     extra_args: --only-verified

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint
      continue-on-error: true

    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: false

    - name: Build NestJS app
      run: npm run build

    - name: PR Validation Summary
      if: success()
      run: |
        echo "## ✅ PR Validation Passed!" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
        echo "This PR is safe to merge." >> $GITHUB_STEP_SUMMARY

    - name: PR Validation Failed
      if: failure()
      run: |
        echo "## ❌ PR Validation Failed!" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
        echo "This PR cannot be merged until all checks pass." >> $GITHUB_STEP_SUMMARY
        exit 1

  build-test:
    name: CI - Build, Lint, Test
    runs-on: [ self-hosted, linux, x64 ]
    if: github.event_name == 'push' || github.event.pull_request.merged == true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # - name: Run lint
    #   run: npm run lint
    #   continue-on-error: false

    # - name: Run tests
    #   run: npm test
    #   continue-on-error: false

    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Build NestJS app
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-dist
        path: dist/
        retention-days: 7

  deploy:
    name: CD - Deploy to server
    needs: build-test
    runs-on: [ self-hosted, linux, x64 ]
    # environment: //we will update this when we ask for permission to create environments
    #   name: staging
    #   # url: ${{ secrets.STAGING_URL }}


    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-dist
        path: dist/

    - name: Determine Environment Secrets
      id: envselect
      run: |
        echo "Branch: ${{ github.ref_name }}"
        if [ "${{ github.ref_name }}" == "staging" ]; then
          echo "SERVER_HOST=${{ secrets.STAGING_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.STAGING_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_PASSWORD=${{ secrets.STAGING_SERVER_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=${{ secrets.STAGING_SERVER_APP_DIR }}" >> $GITHUB_OUTPUT
          echo "DATABASE_URI=${{ secrets.STAGING_DATABASE_URI }}" >> $GITHUB_OUTPUT
          echo "DATABASE_USERNAME=${{ secrets.STAGING_DATABASE_USERNAME }}" >> $GITHUB_OUTPUT
          echo "DATABASE_PASSWORD=${{ secrets.STAGING_DATABASE_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "DATABASE_HOST=${{ secrets.STAGING_DATABASE_HOST }}" >> $GITHUB_OUTPUT
          echo "DATABASE_PORT=${{ secrets.STAGING_DATABASE_PORT }}" >> $GITHUB_OUTPUT
          echo "DATABASE_NAME=${{ secrets.STAGING_DATABASE_NAME }}" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=${{ secrets.STAGING_FRONTEND_URL }}" >> $GITHUB_OUTPUT
          echo "BACKEND_URL=${{ secrets.STAGING_BACKEND_URL }}" >> $GITHUB_OUTPUT
          echo "PORT=${{ secrets.STAGING_PORT }}" >> $GITHUB_OUTPUT
          echo "GOOGLE_CALLBACK_URL=${{ secrets.STAGING_GOOGLE_CALLBACK_URL }}" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME={{ secrets.STAGING_PM2_APP_NAME }}" >> $GITHUB_OUTPUT
          echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
          echo "HEALTH_CHECK_URL=${{ secrets.STAGING_BACKEND_URL }}/api/v1/health" >> $GITHUB_OUTPUT
          echo "JWT_ACCESS_SECRET=${{ secrets.STAGING_JWT_ACCESS_SECRET }}" >> $GITHUB_OUTPUT
          echo "JWT_REFRESH_SECRET=${{ secrets.STAGING_JWT_REFRESH_SECRET }}" >> $GITHUB_OUTPUT
          echo "Environment set to Staging"
        elif [[ "${{ github.ref_name }}" == "prod" || "${{ github.ref_name }}" == "main" ]]; then
          echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "SERVER_PASSWORD=${{ secrets.PROD_SERVER_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "SERVER_APP_DIR=${{ secrets.PROD_SERVER_APP_DIR }}" >> $GITHUB_OUTPUT
          echo "DATABASE_URI=${{ secrets.PROD_DATABASE_URI }}" >> $GITHUB_OUTPUT
          echo "DATABASE_USERNAME=${{ secrets.PROD_DATABASE_USERNAME }}" >> $GITHUB_OUTPUT
          echo "DATABASE_PASSWORD=${{ secrets.PROD_DATABASE_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "DATABASE_HOST=${{ secrets.PROD_DATABASE_HOST }}" >> $GITHUB_OUTPUT
          echo "DATABASE_PORT=${{ secrets.PROD_DATABASE_PORT }}" >> $GITHUB_OUTPUT
          echo "DATABASE_NAME=${{ secrets.PROD_DATABASE_NAME }}" >> $GITHUB_OUTPUT
          echo "BACKEND_URL=${{ secrets.PROD_BACKEND_URL }}" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=${{ secrets.PROD_FRONTEND_URL }}" >> $GITHUB_OUTPUT
          echo "PORT=${{ secrets.PROD_PORT }}" >> $GITHUB_OUTPUT
          echo "GOOGLE_CALLBACK_URL=${{ secrets.PROD_GOOGLE_CALLBACK_URL }}" >> $GITHUB_OUTPUT
          echo "PM2_APP_NAME={{ secrets.PROD_PM2_APP_NAME}}" >> $GITHUB_OUTPUT
          echo "ENV_NAME=production" >> $GITHUB_OUTPUT
          echo "HEALTH_CHECK_URL=${{ secrets.PROD_BACKEND_URL }}/api/v1/health" >> $GITHUB_OUTPUT
          echo "JWT_REFRESH_SECRET=${{ secrets.PROD_JWT_REFRESH_SECRET }}" >> $GITHUB_OUTPUT
          echo "JWT_ACCESS_SECRET=${{ secrets.PROD_JWT_ACCESS_SECRET }}" >> $GITHUB_OUTPUT
          echo "Environment set to Production"
        else
          echo "Unknown branch!"
          exit 1
        fi

    - name: Deploy via SSH
      run: |
        sshpass -p "${{ steps.envselect.outputs.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ steps.envselect.outputs.SERVER_USER }}@${{ steps.envselect.outputs.SERVER_HOST }} << 'ENDSSH'
          set -e
          echo "📦 Navigating to application directory..."
          cd ${{ steps.envselect.outputs.SERVER_APP_DIR }}
          echo "🔄 Fetching latest code..."
          git fetch --all
          git reset --hard origin/${{ github.ref_name }}
          echo "📥 Installing dependencies..."
          npm ci --legacy-peer-deps
          echo "⚙️ Writing .env file..."
          set +x 
          echo "API_VERSION=${{ secrets.API_VERSION }}" > .env
          echo "PORT=${{ steps.envselect.outputs.PORT }}" >> .env
          echo "DATABASE_URI=${{ steps.envselect.outputs.DATABASE_URI }}" >> .env
          echo "DATABASE_NAME=${{ steps.envselect.outputs.DATABASE_NAME }}" >> .env
          echo "DATABASE_HOST=${{ steps.envselect.outputs.DATABASE_HOST }}" >> .env
          echo "DATABASE_PASSWORD=${{ steps.envselect.outputs.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_USERNAME=${{ steps.envselect.outputs.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PORT=${{ steps.envselect.outputs.DATABASE_PORT }}" >> .env
          echo "FRONTEND_URL=${{ steps.envselect.outputs.FRONTEND_URL }}" >> .env
          echo "BACKEND_URL=${{ steps.envselect.outputs.BACKEND_URL }}" >> .env
          echo "PM2_APP_NAME=${{ steps.envselect.outputs.PM2_APP_NAME }}" >> .env
          echo "EMAIL_MAILER=${{ steps.envselect.outputs.MAIL_MAILER }}" >> .env
          echo "EMAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env
          echo "EMAIL_PORT=${{ secrets.MAIL_PORT }}" >> .env
          echo "EMAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "EMAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          echo "EMAIL_ENCRYPTION=${{ secrets.MAIL_ENCRYPTION }}" >> .env
          echo "EMAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}" >> .env
          echo "EMAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_CALLBACK_URL=http://localhost:3600/api/v1/auth/google/callback" >> .env
          echo "POSTMAN_API_KEY=${{ secrets.POSTMAN_API_KEY }}" >> .env
          echo "JWT_ACCESS_SECRET=${{ steps.envselect.outputs.JWT_ACCESS_SECRET }}" >> .env
          echo "JWT_REFRESH_SECRET=${{ steps.envselect.outputs.JWT_REFRESH_SECRET }}" >> .env
          echo "HEALTH_CHECK_URL=${{ steps.envselect.outputs.HEALTH_CHECK_URL }}" >> .env
          set -x
          echo "🔨 Building app..."
          npm run build
          echo "🛠️ Running database migrations..."
          echo "#--we should not generate migrations on staging or prod. it is gotten from the script"
          npm run migration:generate 
          npm run migration:run
          echo "🚀 Restarting application with PM2..."
          pm2 reload ${{ steps.envselect.outputs.PM2_APP_NAME }} || pm2 start dist/main.js --name ${{ steps.envselect.outputs.PM2_APP_NAME }}
          pm2 save
          pm2 list
        ENDSSH

    - name: Health Check
      run: |
        sshpass -p "${{ steps.envselect.outputs.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ steps.envselect.outputs.SERVER_USER }}@${{ steps.envselect.outputs.SERVER_HOST }} << 'ENDSSH'
          echo "Waiting for app to start..."
          sleep 15
          echo "🏥 Performing health check on ${{ steps.envselect.outputs.ENV_NAME }}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.envselect.outputs.HEALTH_CHECK_URL }} || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Health check passed!"
          else
            echo "Health check failed with code $HTTP_STATUS"
            pm2 logs backend --lines 50
            exit 1
          fi
        ENDSSH

    - name: Deployment Summary
      if: success()
      run: |
        echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ steps.envselect.outputs.ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

    - name: Deployment Failed
      if: failure()
      run: |
        echo "## ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ steps.envselect.outputs.ENV_NAME }}" >> $GITHUB_STEP_SUMMARY
