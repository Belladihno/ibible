name: Deploy Backend to Staging

on:
  push:
    branches:
    - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: SSH into server & deploy
      uses: appleboy/ssh-action@v1.0.3

      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}

        script: |
          cd ${{ secrets.SERVER_APP_DIR }}

          echo "Fetching latest code..."
          git fetch --all
          git reset --hard origin/staging

          echo "Installing dependencies..."
          npm install --legacy-peer-deps

          echo "Creating .env from .env.example..."
          cp .env.example .env

          sed -i "s|API_VERSION=.*|API_VERSION=${{ secrets.API_VERSION }}|" .env

          sed -i "s|PORT=.*|PORT=${{ secrets.PORT }}|" .env

          # PostgreSQL
          sed -i "s|DATABASE_URI=.*|DATABASE_URI=${{ secrets.DATABASE_URI }}|" .env

          # SMTP
          sed -i "s|EMAIL_MAILER=.*|EMAIL_MAILER=smtp|" .env
          sed -i "s|EMAIL_HOST=.*|EMAIL_HOST=${{ secrets.MAIL_HOST }}|" .env
          sed -i "s|EMAIL_PORT=.*|EMAIL_PORT=${{ secrets.MAIL_PORT }}|" .env
          sed -i "s|EMAIL_USERNAME=.*|EMAIL_USERNAME=${{ secrets.MAIL_USERNAME }}|" .env
          sed -i "s|EMAIL_PASSWORD=.*|EMAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}|" .env
          sed -i "s|EMAIL_ENCRYPTION=.*|EMAIL_ENCRYPTION=${{ secrets.MAIL_ENCRYPTION }}|" .env
          sed -i "s|EMAIL_FROM_ADDRESS=.*|EMAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}|" .env
          sed -i "s|EMAIL_FROM_NAME=.*|EMAIL_FROM_NAME=\"${{ secrets.MAIL_FROM_NAME }}\"|" .env

          echo "Building TypeScript..."
          npm run build

          echo "Reloading server with zero downtime..."
          pm2 reload backend || pm2 start dist/main.js --name backend
